[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtf-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13",
  "pydantic-settings>=2.4", "cryptography>=43", "httpx>=0.27", "boto3>=1.35",
  "apscheduler>=3.10,<4",
]
[project.optional-dependencies]
agents = ["strands-agents[openai,anthropic,ollama]>=1.0", "bedrock-agentcore>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["app/services/hookkit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.pycodestyle]
max-line-length = 130

[tool.mypy]
exclude = ["app/services/hookkit/"]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
